<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List interactiva</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>Mi Lista de Tareas</h1>
    </header>

    <main>

        <!-- Contenedor para agregar nuevas tareas -->
        <div class="agregarTarea">
            <input type="text" id="inputTarea" placeholder="Escribe una nueva tarea...">
            <button id="btnAgregar">Agregar</button>
        </div>

        <!-- Filtros para mostrar tareas -->
        <div class="filtros">
            <button class="filtro activo" data-filtro="todas">Todas</button>
            <button class="filtro" data-filtro="pendientes">Pendientes</button>
            <button class="filtro" data-filtro="completadas">Completadas</button>
        </div>

        <!-- Tareas pendientes --> 
        <p class="contador">Tareas pendientes: <span id="contador">0</span></p>
        <ul id="tareas"></ul>

        <button id="btnLimpiar">Limpiar tareas completadas</button>

    </main>

    <script src="script.js"></script>

</body>
</html>
